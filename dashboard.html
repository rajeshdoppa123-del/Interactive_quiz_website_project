<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | QuizMaster</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-bg">
  <div id="nav"></div>

  <main class="container page-space">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <span class="tag">OVERVIEW</span>
        <h1>
          Welcome back,
          <span id="userName">Quiz Player</span>
          👋
        </h1>
      </div>

      <a href="quiz.html" class="btn btn-primary">
        Start New Quiz
      </a>
    </div>

    <div class="row g-4">
      <div class="col-md-3">
        <div class="metric">
          <small>QUIZZES</small>
          <b id="attempts">0</b>
          <span>Attempts</span>
        </div>
      </div>

      <div class="col-md-3">
        <div class="metric">
          <small>AVERAGE</small>
          <b id="average">0%</b>
          <span>Accuracy</span>
        </div>
      </div>

      <div class="col-md-3">
        <div class="metric">
          <small>STREAK</small>
          <b>7 🔥</b>
          <span>Days</span>
        </div>
      </div>

      <div class="col-md-3">
        <div class="metric">
          <small>BADGES</small>
          <b>4 🏅</b>
          <span>Unlocked</span>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-2">
      <div class="col-lg-8">
        <div class="panel">
          <h4>Performance</h4>

          <div class="bar-chart">
            <div style="height: 45%">
              <span>Mon</span>
            </div>

            <div style="height: 65%">
              <span>Tue</span>
            </div>

            <div style="height: 55%">
              <span>Wed</span>
            </div>

            <div style="height: 80%">
              <span>Thu</span>
            </div>

            <div style="height: 70%">
              <span>Fri</span>
            </div>

            <div style="height: 92%">
              <span>Sat</span>
            </div>

            <div style="height: 76%">
              <span>Sun</span>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="panel">
          <h4>Achievements</h4>

          <div class="achievement">
            🏆 <b>Quiz Starter</b>
            <small>First quiz completed</small>
          </div>

          <div class="achievement">
            🔥 <b>On Fire</b>
            <small>7 day streak</small>
          </div>

          <div class="achievement">
            🎯 <b>Sharp Mind</b>
            <small>80% accuracy</small>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
