<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard | QuizMaster</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="nav"></div>

  <main class="container page-space">
    <div class="text-center mb-5">
      <span class="tag">COMPETE</span>
      <h1>Global Leaderboard 🏆</h1>
      <p class="text-muted">Can you reach the top?</p>
    </div>

    <div class="podium">
      <div>
        <b>🥈</b>
        <strong>Arjun</strong>
        <span>92%</span>
      </div>

      <div class="first">
        <b>👑</b>
        <strong>Priya</strong>
        <span>98%</span>
      </div>

      <div>
        <b>🥉</b>
        <strong>Rahul</strong>
        <span>89%</span>
      </div>
    </div>

    <div class="panel mt-5">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Category</th>
            <th>Score</th>
          </tr>
        </thead>

        <tbody id="board"></tbody>
      </table>
    </div>
  </main>

  <script src="js/app.js"></script>

  <script>
    const rows = [
      ["#1", "Priya", "Technology", "98%"],
      ["#2", "Arjun", "Science", "92%"],
      ["#3", "Rahul", "Sports", "89%"],
      ["#4", "Sneha", "GK", "86%"],
      ["#5", "You", "Mixed", "80%"]
    ];

    board.innerHTML = rows
      .map(
        (row) => `
          <tr>
            <td><b>${row[0]}</b></td>
            <td>${row[1]}</td>
            <td>${row[2]}</td>
            <td><b>${row[3]}</b></td>
          </tr>
        `
      )
      .join("");
  </script>
</body>
</html>
