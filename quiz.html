<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz | QuizMaster</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="quiz-bg">
  <div id="nav"></div>

  <main class="container page-space">
    <div class="quiz-wrap">
      <div class="d-flex justify-content-between mb-3">
        <span class="pill-dark" id="cat">Mixed Quiz</span>

        <span>
          ⏱ <b id="timer">30</b>s
        </span>
      </div>

      <div class="progress">
        <div id="progress" class="progress-bar"></div>
      </div>

      <div class="d-flex justify-content-between mt-3 text-muted">
        <span id="count"></span>
        <span id="score">Score: 0</span>
      </div>

      <h2 id="question" class="mt-4"></h2>

      <div id="answers" class="row g-3 mt-2"></div>

      <button
        id="next"
        class="btn btn-primary mt-4 float-end"
        disabled
      >
        Next →
      </button>
    </div>

    <div id="finished" class="quiz-wrap text-center d-none">
      <div class="big-icon">🎉</div>

      <h1>Quiz Complete!</h1>
      <h2 id="result"></h2>
      <p id="message"></p>

      <a href="leaderboard.html" class="btn btn-primary">
        View Leaderboard
      </a>

      <button
        onclick="location.reload()"
        class="btn btn-outline-primary"
      >
        Retry
      </button>
    </div>
  </main>

  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
