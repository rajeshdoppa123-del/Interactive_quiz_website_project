<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | QuizMaster</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="nav"></div>

  <main class="container page-space">
    <div class="profile-card">
      <div class="avatar">Q</div>

      <h2 id="profileName">Quiz Player</h2>
      <p class="text-muted">Quiz Enthusiast</p>

      <div class="row g-3 mt-3">
        <div class="col-md-4">
          <div class="mini-stat">
            <b>24</b>
            <span>Quizzes</span>
          </div>
        </div>

        <div class="col-md-4">
          <div class="mini-stat">
            <b>86%</b>
            <span>Accuracy</span>
          </div>
        </div>

        <div class="col-md-4">
          <div class="mini-stat">
            <b>1,240</b>
            <span>Points</span>
          </div>
        </div>
      </div>

      <a href="quiz.html" class="btn btn-primary mt-4">
        Improve My Score
      </a>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
